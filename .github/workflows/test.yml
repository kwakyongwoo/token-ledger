name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # uv downloads any Python version; setup-python has no 3.9 on newer Ubuntu images
      - uses: astral-sh/setup-uv@v6
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: uv run --python ${{ matrix.python }} --no-project --with "networkx>=3.1" python -m unittest discover -s tests -v
