[project]
name = "token-ledger"
version = "0.3.0"
description = "Per-prompt Claude Code token usage ledger, shared through git."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["networkx>=3.1"]

[project.optional-dependencies]
leiden = ["graspologic"]

[project.scripts]
token-ledger = "token_ledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_ledger"]
